name: fitness_app
description: >-
  An offline-first strength-training tracker. No account, no server, no
  telemetry.
publish_to: none

# Canonical source is the VERSION file at the repo root; CI fails if they
# disagree. See docs/63-VERSIONING.md. The +N build number is set by the
# release workflow (F-REL-005), not by hand.
version: 0.49.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Database — ADR-0005. drift_flutter bundles sqlite3 and path_provider.
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # State and dependency injection — ADR-0006
  flutter_riverpod: ^3.0.3

  # Routing — deep links are load-bearing for F-NAV-007/008 and F-TIM-003
  go_router: ^17.2.1

  # Locale-aware number and date formatting — F-I18N-002. A German user typing
  # "102,5" must work; that is input correctness, not polish.
  intl: ^0.20.2

  # Scalar settings only — unit and theme preferences (F-SET-001, F-SET-002).
  # Anything relational lives in the database, not here.
  shared_preferences: ^2.5.5

  # The system share sheet for the minimal JSON dump (F-DAT-011). Only this
  # one F-DAT-* feature needs it in Phase 1 — the rest still wait for Phase 5.
  share_plus: ^12.0.0

  # Reads the installed package's version/build number for About (F-SET-009,
  # F-REL-005) — the build number is set by the release workflow via
  # --build-number, never hand-edited, so it has to be read back, not stated.
  package_info_plus: ^9.0.1

  # The repository link on About (F-SET-009). Opens the user's own browser;
  # not a network call made by the app itself (ADR-0002).
  url_launcher: ^6.3.2

  # Android 12+ wallpaper-derived colour scheme (F-THM-003). Reads a platform
  # channel only — no network call — and returns null schemes on any
  # unsupported platform, which is exactly the "off" state already needed.
  dynamic_color: ^1.9.0

  # Charts (F-ANA-003, F-THM-004). Renders in-widget, so it themes correctly
  # in light and dark without bespoke platform work (docs/20-ARCHITECTURE.md).
  fl_chart: ^1.1.1

  # Where backups live on-device (F-DAT-003) — already an implicit transitive
  # dep via drift_flutter, now used directly so it's declared, not borrowed.
  path_provider: ^2.1.5

  # Picking a backup file to restore from (F-DAT-004), and a source CSV to
  # import (F-DAT-005/006).
  file_picker: ^11.0.3

  # RFC 4180 parsing for Strong/Hevy import (F-DAT-005/006) — a workout name
  # or note legitimately contains a comma or embedded newline, so a
  # hand-rolled `split(',')` would silently mis-parse exactly the kind of
  # file this feature exists to read correctly.
  csv: ^6.0.0

  # Salted PIN hashing for the app lock (F-SET-010). Dart-team maintained;
  # never hand-roll hashing for anything gating access, even a UI-only gate.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation. Generated .g.dart files are committed; CI regenerates and
  # fails on a diff so they cannot silently drift from their sources.
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

  # Faking the backup directory in restore_service_test.dart.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
# Dependencies deliberately not added yet — each arrives with the batch that
# needs it, to keep `pub get` and CI fast:
#   freezed, json_serializable   → domain entities, when they need unions
#   flutter_local_notifications  → F-TIM-003 (Phase 1)
