# F-REL-001 — checks on demand.
#
# Spec: docs/61-CI-CD.md. Must stay fast (target under ~10 minutes) since it's
# the real signal before a phase closes or before manual testing, not
# something to sit and wait on for the everyday case. Uses no secrets, so it
# works correctly on a fork.
#
# Manual only, deliberately: this ran on every push through v0.48.4, but a
# real toolchain run (Flutter setup, full test suite, a debug APK build and
# upload) for every commit burned the free tier's Actions minutes and pushed
# artifact storage past quota (93 artifacts, ~3.1 GB, almost entirely debug
# APKs). `tools/verify.sh` already runs the same checks locally before every
# push (docs/60-ENGINEERING.md), so the automatic run was mostly re-proving
# what the local one already caught. Trigger it by hand instead — end of a
# phase, before on-device manual testing, or any time the real CI signal is
# wanted rather than the local approximation.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  check:
    name: analyse & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Cheap checks first: they need no toolchain, so a docs mistake fails in
      # seconds rather than after a four-minute Flutter setup.
      - name: Documentation integrity
        run: ./tools/check-docs.sh

      - name: Layer rule — lib/domain/ imports no Flutter, no data layer
        run: ./tools/check-layers.sh

      - name: No network calls — the claim every privacy declaration rests on
        run: ./tools/check-network.sh

      - name: User-facing text lives in the ARB file
        run: ./tools/check-strings.sh

      - name: Version consistency
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < VERSION)
          grep -q "^version: ${V}$" pubspec.yaml || {
            echo "::error::VERSION is '${V}' but pubspec.yaml disagrees:"
            grep '^version:' pubspec.yaml
            exit 1
          }
          echo "VERSION and pubspec.yaml agree: ${V}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # Generated files are committed so the APK job and IDEs need no codegen
      # step. Regenerating here and failing on a diff is what stops them
      # silently drifting from the tables they are generated from.
      - name: Generated code is up to date
        run: |
          set -euo pipefail
          dart run build_runner build
          if ! git diff --quiet -- '*.g.dart'; then
            echo "::error::Generated code is stale. Run: dart run build_runner build"
            git diff --stat -- '*.g.dart'
            exit 1
          fi

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyse
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      # So any commit is installable without a local toolchain.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-app-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
