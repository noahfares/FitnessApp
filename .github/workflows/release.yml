# F-REL-002 (signed release APK), F-REL-003 (GitHub Release automation),
# F-REL-004 (app bundle for Play) — on tag `v*`. See docs/62-RELEASE.md and
# docs/70-decisions/ADR-0007-signing.md.
#
# Deliberately fails rather than falling back to a debug-signed APK when
# signing material is missing: an unsigned or wrongly-signed public artefact
# breaks every future upgrade for anyone who installed it (ADR-0007).
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches VERSION
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < VERSION)
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v${V}" ]; then
            echo "::error::Tag ${TAG} does not match VERSION (v${V}). Refusing to release."
            exit 1
          fi
          grep -q "^version: ${V}$" pubspec.yaml || {
            echo "::error::pubspec.yaml disagrees with VERSION (${V})."
            exit 1
          }
          echo "version=${V}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generated code is up to date
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyse
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # F-REL-005 — monotonically increasing, derived, never hand-edited.
      # Commit count only ever grows, which is all "monotonic" requires here.
      - name: Build number
        id: build_number
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Refusing to build an unsigned or debug-signed release APK (ADR-0007)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Build signed release APK
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ env.version }}" \
            --build-number="${{ steps.build_number.outputs.number }}"

      # F-REL-004 — the Play submission artefact, from the same tag, the same
      # version, and the same signing config (Gradle ties signing to the
      # `release` build *variant*, not the packaging task, so this needs no
      # signing config of its own) as the APK above. Never uploaded anywhere
      # by this workflow — Play submission itself is a manual step, since it
      # needs a live Play Console this CI has no credentials for.
      - name: Build signed app bundle
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ env.version }}" \
            --build-number="${{ steps.build_number.outputs.number }}"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload-keystore.jks"

      # Sideloaded APKs have no store vouching for them — the published hash
      # is the only integrity signal a user gets (F-REL-003). The AAB gets
      # the same treatment for the same reason, even though it's headed to
      # Play rather than a direct download — it's still a hash worth
      # confirming against before it's uploaded anywhere. One combined file,
      # not one per artefact type: GitHub release assets must have unique
      # names, and "both come from the same tag, the same version" (F-REL-004)
      # reads better as one manifest than two identically named files.
      - name: Checksums
        run: |
          sha256sum \
            build/app/outputs/flutter-apk/*.apk \
            build/app/outputs/bundle/release/*.aab \
            > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            checksums.txt
