# String externalisation (`F-I18N-001`).
#
# Generated into lib/l10n/ and committed, the same rule the Drift `*.g.dart`
# files follow (docs/61-CI-CD.md): IDEs and CI jobs then need no codegen step
# before the app compiles, and a stale generation is a visible diff rather than
# a mystery build failure.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n
nullable-getter: false
